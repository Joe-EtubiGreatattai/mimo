name: Windows build

# Builds Mimo for Windows on a real Windows machine, tests it, and attaches
# Mimo-Setup.exe to the release. Runs automatically when a release is published,
# or by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the installer to (for example v1.3.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      # Builds from main (the release's code), then attaches the installer to the release tag.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install
        run: npm ci

      - name: Engine tests (fake Windows user folder)
        run: npm test

      - name: Smoke test (app starts, reads the disk, draws its window)
        run: npx electron . --smoke-test

      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ls -la dist
          gh release upload "$TAG" dist/Mimo-Setup.exe --clobber --repo "$GITHUB_REPOSITORY"

      - uses: actions/upload-artifact@v4
        with:
          name: Mimo-Setup
          path: windows/dist/Mimo-Setup.exe
